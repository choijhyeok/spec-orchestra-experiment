<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Requests · Request Desk</title>
  <link rel="stylesheet" href="/shared.css">
  <script src="/shared.js" defer></script>
  <script src="/requests.js" defer></script>
</head>
<body>
  <div id="app-header"></div>
  <main>
    <div class="page-heading">
      <h1>Requests</h1>
      <p>Browse requests or search by title, requester name or email.</p>
    </div>
    <form id="search-form" class="card" role="search">
      <div class="field">
        <label for="search">Search</label>
        <input id="search" name="q" type="search" placeholder="Title, requester name or email" aria-describedby="search-help">
        <span id="search-help" class="muted">Search matches any part of a title, requester name or email.</span>
      </div>
      <button type="submit">Search</button>
    </form>
    <p id="status" class="muted" role="status" aria-live="polite">Loading requests…</p>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="requests" class="results" aria-label="Requests" aria-busy="true"></ul>
    <div id="empty" class="card" hidden>
      <h2 id="empty-title">No requests yet</h2>
      <p id="empty-description">Create a request to get started.</p>
      <a href="/create">New request</a>
    </div>
    <noscript><p class="error">JavaScript is needed to load and search requests.</p></noscript>
  </main>
</body>
</html>
