<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI baseline · Request Desk</title>
<link rel="stylesheet" href="/shared.css">
<script src="/shared.js" defer></script>
</head>
<body>
<header class="site-header" data-shell></header>
<main>
  <div class="stack"><h1>UI baseline</h1><p class="muted">Common components for Request Desk.</p></div>
  <section class="card stack" aria-labelledby="components-title">
    <h2 id="components-title">Request form components</h2>
    <div class="field"><label for="example-title">Title</label><input id="example-title" value="Review welcome copy"></div>
    <div class="field"><label for="example-email">Requester email</label><input id="example-email" type="email" value="mina@example.test"></div>
    <div class="actions"><button type="button">Create request</button><a href="/requests">View requests</a></div>
  </section>
  <article class="card stack"><h2>Review welcome copy</h2><p class="muted">Mina Park</p><p class="muted">mina@example.test</p></article>
</main>
</body>
</html>
